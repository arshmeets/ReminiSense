[project]
name = "landing"
version = "1.0.0"
description = "Jac client application: landing"
entry-point = "main.jac"
kind = "web-static"
jac-version = "==0.34.7"

[dependencies]
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

