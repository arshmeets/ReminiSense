name: ReminiSense
options:
  bundleIdPrefix: com.reminisense
  deploymentTarget:
    iOS: "17.0"

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.8.0

targets:
  ReminiSense:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATDisplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reminisense.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ReminiSense
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: ReminiSense uses the iPhone camera as a fallback when your glasses are not connected.
        NSBluetoothAlwaysUsageDescription: Needed to connect to your Meta Ray-Ban Display glasses.
        NSLocalNetworkUsageDescription: Lets your phone find and talk to your glasses over Wi-Fi.
        NSBonjourServices: [_bonjour._tcp]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        UIBackgroundModes: [processing, bluetooth-central, bluetooth-peripheral, external-accessory]
        LSApplicationQueriesSchemes: [fb-viewapp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.reminisense.app
            CFBundleURLSchemes: [reminisense]
        MWDAT:
          AppLinkURLScheme: "reminisense://"
          MetaAppID: "0"
          ClientToken: ""
          TeamID: "$(DEVELOPMENT_TEAM)"
    entitlements:
      path: ReminiSense.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.reminisense.app
