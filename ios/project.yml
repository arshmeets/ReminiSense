name: ReminiSense
options:
  bundleIdPrefix: com.reminisense
  deploymentTarget:
    iOS: "17.0"

packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 0.8.0

targets:
  ReminiSense:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATDisplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reminisense.app
        # Team ID from the signing cert's OU (matches the local
        # "iOS Team Provisioning Profile: com.reminisense.app").
        DEVELOPMENT_TEAM: 6TMMQ8VD2T
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Recall
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Recall captures one frame at a time to recognise who you're talking to — from your glasses, or the iPhone camera when they aren't connected.
        NSMicrophoneUsageDescription: Recall listens for a few seconds after you tap Meet (or while you hold Listen) so it can turn an introduction into a contact in your network graph.
        NSSpeechRecognitionUsageDescription: Recall transcribes those few seconds on your phone so the graph can pull out names, companies and follow-ups.
        NSBluetoothAlwaysUsageDescription: Needed to connect to your Meta Ray-Ban Display glasses.
        NSLocalNetworkUsageDescription: Lets your phone find and talk to your glasses over Wi-Fi.
        NSBonjourServices: [_bonjour._tcp]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        # `audio` keeps the shared AVAudioSession (and therefore live
        # transcription) alive across a hop into the Meta AI app mid-demo.
        UIBackgroundModes: [audio, processing, bluetooth-central, bluetooth-peripheral, external-accessory]
        LSApplicationQueriesSchemes: [fb-viewapp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.reminisense.app
            CFBundleURLSchemes: [reminisense]
        MWDAT:
          AppLinkURLScheme: "reminisense://"
          MetaAppID: "0"
          ClientToken: ""
          TeamID: "$(DEVELOPMENT_TEAM)"
    entitlements:
      path: ReminiSense.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.reminisense.app
