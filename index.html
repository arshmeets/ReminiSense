132px);margin-block:22px .3em}.hero h1{margin-bottom:20px}.whisper{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:26px 28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}.whisper .head{display:flex;align-items:center;gap:9px}.whisper .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}.whisper .line{font-family:var(--f-display);font-weight:500;letter-spacing:-.028em;font-size:clamp(20px,2.3vw,25px);line-height:1.32;max-width:none}.whisper .cap{font-size:14px;color:var(--muted);border-top:1px solid var(--hair);padding-top:14px;max-width:none}section{padding-block:clamp(40px,5.5vw,64px)}.rule{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-top:1px solid var(--ink);padding-top:10px;margin-bottom:clamp(26px,3.5vw,40px)}.rule .wordmark{font-size:12px}.lead-in{margin-bottom:clamp(26px,3.5vw,40px);display:flex;flex-direction:column;gap:14px}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}@media(max-width:780px){.panels{grid-template-columns:1fr}}.panels>div{background:var(--surface);padding:24px 24px 28px;display:flex;flex-direction:column;gap:10px}.panels p{font-size:15.5px;color:var(--muted);margin:0;max-width:none}.panels .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}.figure{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 0;overflow-x:auto}.figure svg{display:block;width:100%;min-width:520px;height:auto}.cap{margin-top:12px;font-size:15px;color:var(--muted)}.closing{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,48px);align-items:start}@media(max-width:780px){.closing{grid-template-columns:1fr}}footer{padding-block:0 56px}.foot{display:flex;justify-content:space-between;align-items:flex-start;gap:32px;flex-wrap:wrap;border-top:1px solid var(--ink)
